<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Auditoría · Transporte HN</title>
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <svg class="ico" viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M8 6v6M16 6v6M2 12h19.6M18 18h3s.5-1.7.8-2.8c.1-.4.2-.8.2-1.2 0-.4-.1-.8-.2-1.2l-1.4-5C20.1 6.8 19.1 6 18 6H4a2 2 0 0 0-2 2v10h3"/>
        <circle cx="7" cy="18" r="2"/><path d="M9 18h5"/><circle cx="16" cy="18" r="2"/>
      </svg>
      <span>Transporte HN</span>
    </div>
    <nav class="nav">
      <a href="dashboard.html">Panel principal</a>
      <a href="boletos.html">Boletos</a>
      <a href="horarios.html">Horarios</a>
      <a href="rutas.html">Rutas</a>
      <a href="buses.html">Buses</a>
      <a href="conductores.html">Conductores</a>
      <a href="clientes.html">Clientes</a>
      <a href="mantenimiento.html">Mantenimiento</a>
      <a href="pago.html">Pagos</a>
      <a href="reportes.html">Reportes</a>
      <a href="auditoria.html" class="active">Auditoría</a>
    </nav>
    <div class="user-menu">
      <span id="usuarioActual">Empleado</span>
      <a class="btn sm" href="login.html" id="btnLogout">Salir</a>
    </div>
  </header>

  <main class="container">
    <div class="page-header">
      <h1>Auditoría</h1>
      <p class="subtitle">Bitácora de cambios registrada por la base de datos</p>
    </div>
    <div id="flashContainer"></div>
    <section class="panel">
      <div class="toolbar">
        <h2 style="margin:0">Últimos movimientos</h2>
        <input type="search" placeholder="Filtrar…" data-filtro="#tb">
      </div>
      <div class="table-wrap">
        <table id="tb">
          <thead>
            <tr>
              <th>Fecha</th>
              <th>Tabla</th>
              <th>Acción</th>
              <th>Antes</th>
              <th>Después</th>
              <th>Usuario</th>
              <th>Equipo</th>
            </tr>
          </thead>
          <tbody id="tbodyAuditoria">
            <tr><td colspan="7" class="empty">Sin movimientos.</td></tr>
          </tbody>
        </table>
      </div>
    </section>
  </main>

  <script src="js/config.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
