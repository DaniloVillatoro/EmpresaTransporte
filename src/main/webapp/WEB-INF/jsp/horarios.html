<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Horarios · Transporte HN</title>
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <svg class="ico" viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M8 6v6M16 6v6M2 12h19.6M18 18h3s.5-1.7.8-2.8c.1-.4.2-.8.2-1.2 0-.4-.1-.8-.2-1.2l-1.4-5C20.1 6.8 19.1 6 18 6H4a2 2 0 0 0-2 2v10h3"/>
        <circle cx="7" cy="18" r="2"/><path d="M9 18h5"/><circle cx="16" cy="18" r="2"/>
      </svg>
      <span>Transporte HN</span>
    </div>
    <nav class="nav">
      <a href="/panel">Panel principal</a>
      <a href="/boletos">Boletos</a>
      <a href="/horarios" class="active">Horarios</a>
      <a href="/rutas">Rutas</a>
      <a href="/buses">Buses</a>
      <a href="/conductores">Conductores</a>
      <a href="/clientes">Clientes</a>
      <a href="/mantenimiento">Mantenimiento</a>
      <a href="/pagos">Pagos</a>
      <a href="/reportes">Reportes</a>
      <a href="/auditoria">Auditoría</a>
    </nav>
    <div class="user-menu">
      <span id="usuarioActual">Empleado</span>
      <a class="btn sm" href="/logout">Salir</a>
    </div>
  </header>

  <main class="container">
    <div class="page-header">
      <h1>Horarios</h1>
      <p class="subtitle">Programa salidas: al guardar se generan los asientos a la venta</p>
    </div>
    <div id="flashContainer"></div>
    <div class="grid even">
      <section class="panel">
        <h2>Programar horario</h2>
        <form method="post" action="/horarios" id="formHorario">
          <input type="hidden" name="_csrf" value="">
          <label>Ruta</label>
          <select name="idRuta" id="selectRuta" required>
            <option value="">Seleccionar…</option>
          </select>
          <div class="row2">
            <div>
              <label>Bus</label>
              <select name="idBus" id="selectBus" required>
                <option value="">Seleccionar…</option>
              </select>
            </div>
            <div>
              <label>Conductor</label>
              <select name="idConductor" id="selectConductor" required>
                <option value="">Seleccionar…</option>
              </select>
            </div>
          </div>
          <div class="row2">
            <div><label>Fecha de salida</label><input type="date" name="fechaSalida" required></div>
            <div><label>Hora de salida</label><input type="time" name="horaSalida" required></div>
          </div>
          <div class="row2">
            <div><label>Fecha de llegada</label><input type="date" name="fechaLlegada" required></div>
            <div><label>Hora de llegada</label><input type="time" name="horaLlegada" required></div>
          </div>
          <button class="btn primary block" type="submit">Programar horario</button>
        </form>
      </section>
      <section class="panel">
        <div class="toolbar">
          <h2 style="margin:0">Horarios</h2>
          <input type="search" placeholder="Buscar…" data-filtro="#tb">
        </div>
        <div class="table-wrap">
          <table id="tb">
            <thead>
              <tr>
                <th>Ruta</th>
                <th>Bus</th>
                <th>Conductor</th>
                <th>Salida</th>
                <th class="num">Ocupación</th>
                <th>Estado</th>
                <th></th>
              </tr>
            </thead>
            <tbody id="tbodyHorarios">
              <tr><td colspan="7" class="empty">Sin horarios.</td></tr>
            </tbody>
          </table>
        </div>
      </section>
    </div>
  </main>

  <script src="js/app.js"></script>
</body>
</html>
