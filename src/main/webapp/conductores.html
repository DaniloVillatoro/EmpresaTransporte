<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Conductores · Transporte HN</title>
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <svg class="ico" viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M8 6v6M16 6v6M2 12h19.6M18 18h3s.5-1.7.8-2.8c.1-.4.2-.8.2-1.2 0-.4-.1-.8-.2-1.2l-1.4-5C20.1 6.8 19.1 6 18 6H4a2 2 0 0 0-2 2v10h3"/>
        <circle cx="7" cy="18" r="2"/><path d="M9 18h5"/><circle cx="16" cy="18" r="2"/>
      </svg>
      <span>Transporte HN</span>
    </div>
    <nav class="nav">
      <a href="dashboard.html">Panel principal</a>
      <a href="boletos.html">Boletos</a>
      <a href="horarios.html">Horarios</a>
      <a href="rutas.html">Rutas</a>
      <a href="buses.html">Buses</a>
      <a href="conductores.html" class="active">Conductores</a>
      <a href="clientes.html">Clientes</a>
      <a href="mantenimiento.html">Mantenimiento</a>
      <a href="pago.html">Pagos</a>
      <a href="reportes.html">Reportes</a>
      <a href="auditoria.html">Auditoría</a>
    </nav>
    <div class="user-menu">
      <span id="usuarioActual">Empleado</span>
      <a class="btn sm" href="login.html" id="btnLogout">Salir</a>
    </div>
  </header>

  <main class="container">
    <div class="page-header">
      <h1>Conductores</h1>
      <p class="subtitle">Control de licencias y disponibilidad</p>
    </div>
    <div id="flashContainer"></div>
    <div class="grid even">
      <section class="panel">
        <h2>Registrar conductor</h2>
        <form id="formConductor">
          <div class="row2">
            <div><label>Nombre</label><input name="nombre" required maxlength="60"></div>
            <div><label>Apellido</label><input name="apellido" required maxlength="60"></div>
          </div>
          <div class="row2">
            <div><label>Identidad</label><input name="identidad" required maxlength="20"></div>
            <div><label>Teléfono</label><input name="telefono" maxlength="20"></div>
          </div>
          <label>Dirección</label>
          <input name="direccion" maxlength="200">
          <div class="row3">
            <div><label>Licencia</label><input name="licencia" required maxlength="30"></div>
            <div><label>Vence</label><input type="date" name="fechaVencimientoLicencia" required></div>
            <div><label>Contratado</label><input type="date" name="fechaContratacion"></div>
          </div>
          <button class="btn primary block" type="submit">Guardar conductor</button>
        </form>
      </section>
      <section class="panel">
        <div class="toolbar">
          <h2 style="margin:0">Conductores</h2>
          <input type="search" placeholder="Buscar…" data-filtro="#tb">
        </div>
        <div class="table-wrap">
          <table id="tb">
            <thead>
              <tr>
                <th>Nombre</th>
                <th>Identidad</th>
                <th>Licencia</th>
                <th>Vence</th>
                <th>Estado</th>
                <th></th>
              </tr>
            </thead>
            <tbody id="tbodyConductores">
              <tr><td colspan="6" class="empty">Sin conductores.</td></tr>
            </tbody>
          </table>
        </div>
      </section>
    </div>
  </main>

  <script src="js/config.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
